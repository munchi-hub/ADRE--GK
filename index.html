<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADRE Prep – Assam Exam Preparation</title>

<meta name="description" content="Practice ADRE questions with free daily quizzes and topic-wise preparation for Assam Direct Recruitment Exam.">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

header {
    background: #182848;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.result {
    text-align: center;
}

.result h2 {
    font-size: 30px;
}

.topic-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.topic-btn {
    padding: 18px 10px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.topic-btn:hover {
    background: #f1f4ff;
}

#question {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 20px;
}

.option {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.option:hover {
    background: #f1f4ff;
}

.option:disabled {
    cursor: default;
}

#feedback {
    margin-top: 18px;
    font-size: 18px;
    font-weight: bold;
    min-height: 25px;
}

#nextBtn,
#restartBtn,
#homeBtn {
    margin-top: 20px;
    padding: 14px 25px;
    border: none;
    border-radius: 10px;
    background: #182848;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#score {
    text-align: right;
    font-weight: bold;
    margin-bottom: 15px;
}

.hidden {
    display: none;
}

@media (max-width: 600px) {
    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .card {
        padding: 20px;
    }

    header h1 {
        font-size: 24px;
    }

    .topic-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>ADRE Prep</h1>
    <p>Assam Direct Recruitment Exam Preparation</p>
</header>

<div class="container">

    <!-- TOPIC SCREEN -->
    <div id="topicScreen" class="card result">

        <h2>📚 Choose a Topic</h2>

        <p>Select a subject to start practicing.</p>

        <div class="topic-grid">

            <button class="topic-btn" onclick="startQuiz('assam')">
                🇦🇸 Assam GK
            </button>

            <button class="topic-btn" onclick="startQuiz('india')">
                🇮🇳 Indian GK
            </button>

            <button class="topic-btn" onclick="startQuiz('history')">
                🏛️ History
            </button>

            <button class="topic-btn" onclick="startQuiz('geography')">
                🌍 Geography
            </button>

            <button class="topic-btn" onclick="startQuiz('polity')">
                ⚖️ Indian Polity
            </button>

            <button class="topic-btn" onclick="startQuiz('science')">
                🔬 General Science
            </button>

            <button class="topic-btn" onclick="startQuiz('economy')">
                💰 Economy
            </button>

            <button class="topic-btn" onclick="startQuiz('reasoning')">
                🧠 Reasoning
            </button>

            <button class="topic-btn" onclick="startQuiz('maths')">
                🔢 Mathematics
            </button>

            <button class="topic-btn" onclick="startQuiz('english')">
                📖 English
            </button>

            <button class="topic-btn" onclick="startQuiz('culture')">
                🎭 Assam Culture
            </button>

            <button class="topic-btn" onclick="startQuiz('current')">
                📰 Current Affairs
            </button>

        </div>

    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="card hidden">

        <div id="score">Score: 0</div>

        <div id="question"></div>

        <div id="options"></div>

        <div id="feedback"></div>

        <button id="nextBtn" class="hidden" onclick="nextQuestion()">
            Next Question →
        </button>

    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="card result hidden">

        <h2>🎉 Quiz Complete!</h2>

        <p id="finalScore"></p>

        <button id="restartBtn" onclick="showTopics()">
            Choose Another Topic
        </button>

        <br>

        <button id="homeBtn" onclick="showTopics()">
            🏠 Back to Topics
        </button>

    </div>

</div>

<script>

const questions = {

    assam: [
        {
            question: "What is the capital of Assam?",
            options: ["Guwahati", "Dispur", "Jorhat", "Dibrugarh"],
            answer: 1
        },
        {
            question: "Which river is often called the lifeline of Assam?",
            options: ["Ganga", "Yamuna", "Brahmaputra", "Godavari"],
            answer: 2
        },
        {
            question: "Which is the largest river island in Assam?",
            options: ["Majuli", "Umananda", "Dibru", "Chandubi"],
            answer: 0
        },
        {
            question: "Kaziranga National Park is famous for which animal?",
            options: ["Asiatic Lion", "One-horned Rhinoceros", "Tiger", "Elephant"],
            answer: 1
        },
        {
            question: "What is the state animal of Assam?",
            options: ["Tiger", "Elephant", "One-horned Rhinoceros", "Wild Buffalo"],
            answer: 2
        }
    ],

    india: [
        {
            question: "What is the capital of India?",
            options: ["Mumbai", "New Delhi", "Kolkata", "Chennai"],
            answer: 1
        },
        {
            question: "What is the national animal of India?",
            options: ["Lion", "Elephant", "Tiger", "Leopard"],
            answer: 2
        },
        {
            question: "Which is the largest state of India by area?",
            options: ["Maharashtra", "Rajasthan", "Madhya Pradesh", "Uttar Pradesh"],
            answer: 1
        }
    ],

    history: [
        {
            question: "Who was the first emperor of the Maurya Empire?",
            options: ["Ashoka", "Chandragupta Maurya", "Bindusara", "Harsha"],
            answer: 1
        },
        {
            question: "Who founded the Mughal Empire in India?",
            options: ["Akbar", "Babur", "Humayun", "Shah Jahan"],
            answer: 1
        },
        {
            question: "In which year did India become independent?",
            options: ["1945", "1946", "1947", "1950"],
            answer: 2
        }
    ],

    geography: [
        {
            question: "Which is the longest river in India?",
            options: ["Ganga", "Yamuna", "Godavari", "Narmada"],
            answer: 0
        },
        {
            question: "Which is the highest mountain peak in India?",
            options: ["Mount Everest", "Kangchenjunga", "Nanda Devi", "Annapurna"],
            answer: 1
        }
    ],

    polity: [
        {
            question: "Who is the constitutional head of India?",
            options: ["Prime Minister", "President", "Chief Justice", "Home Minister"],
            answer: 1
        },
        {
            question: "How many houses are there in the Parliament of India?",
            options: ["One", "Two", "Three", "Four"],
            answer: 1
        }
    ],

    science: [
        {
            question: "What is the chemical formula of water?",
            options: ["CO2", "O2", "H2O", "NaCl"],
            answer: 2
        },
        {
            question: "Which planet is known as the Red Planet?",
            options: ["Venus", "Mars", "Jupiter", "Mercury"],
            answer: 1
        }
    ],

    economy: [
        {
            question: "What does GDP stand for?",
            options: [
                "Gross Domestic Product",
                "General Domestic Price",
                "Gross Development Plan",
                "Government Domestic Product"
            ],
            answer: 0
        }
    ],

    reasoning: [
        {
            question: "If 2, 4, 6, 8, what comes next?",
            options: ["9", "10", "11", "12"],
            answer: 1
        }
    ],

    maths: [
        {
            question: "What is 15 + 27?",
            options: ["40", "41", "42", "43"],
            answer: 2
        }
    ],

    english: [
        {
            question: "Choose the synonym of 'Happy'.",
            options: ["Sad", "Joyful", "Angry", "Weak"],
            answer: 1
        }
    ],

    culture: [
        {
            question: "Which festival is widely celebrated in Assam?",
            options: ["Bihu", "Onam", "Pongal", "Lohri"],
            answer: 0
        }
    ],

    current: [
        {
            question: "Current Affairs questions will be added regularly.",
            options: ["Continue", "Continue", "Continue", "Continue"],
            answer: 0
        }
    ]

};

let currentTopic = "";
let currentQuestion = 0;
let score = 0;

function startQuiz(topic) {

    currentTopic = topic;
    currentQuestion = 0;
    score = 0;

    document.getElementById("topicScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");

    showQuestion();
}

function showQuestion() {

    const q = questions[currentTopic][currentQuestion];

    document.getElementById("question").textContent =
        (currentQuestion + 1) + ". " + q.question;

    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").classList.add("hidden");

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.textContent = option;

        button.className = "option";

        button.onclick = function() {
            checkAnswer(index);
        };

        optionsDiv.appendChild(button);

    });

}

function checkAnswer(selected) {

    const q = questions[currentTopic][currentQuestion];

    const buttons = document.querySelectorAll(".option");

    buttons.forEach(button => {
        button.disabled = true;
    });

    if (selected === q.answer) {

        score++;

        document.getElementById("feedback").textContent =
            "🎉 WOW! Correct answer!";

    } else {

        document.getElementById("feedback").textContent =
            "😅 UGH! Wrong answer!";

    }

    document.getElementById("score").textContent =
        "Score: " + score;

    document.getElementById("nextBtn").classList.remove("hidden");

}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions[currentTopic].length) {

        document.getElementById("quizScreen").classList.add("hidden");

        document.getElementById("resultScreen").classList.remove("hidden");

        document.getElementById("finalScore").textContent =
            "You scored " + score + " out of " +
            questions[currentTopic].length + ".";

    } else {

        showQuestion();

    }

}

function showTopics() {

    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("topicScreen").classList.remove("hidden");

}

</script>

</body>
</html>
