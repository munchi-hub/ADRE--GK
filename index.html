<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADRE Prep</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

header {
    background: #182848;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 22px;
    margin: 15px 0;
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

button {
    border: none;
    border-radius: 11px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #182848;
    color: white;
}

.topic {
    width: 100%;
    margin: 7px 0;
    background: white;
    border: 2px solid #ddd;
    text-align: left;
}

.topic:hover {
    background: #f1f4ff;
}

.study-question {
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.study-question:last-child {
    border-bottom: none;
}

.answer {
    margin-top: 12px;
    padding: 12px;
    background: #eefaf2;
    border-radius: 10px;
    font-weight: bold;
}

.hidden {
    display: none;
}

.back {
    background: #eee;
    margin-bottom: 10px;
}

.error {
    color: #a00000;
    background: #fff0f0;
    padding: 12px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>📚 ADRE Prep</h1>
    <p>Learn • Practice • Improve</p>
</header>

<div class="container">

    <div id="library" class="card">
        <h2>📖 Study Library</h2>
        <p>Choose a subject to start studying.</p>

        <button class="topic" onclick="openTopic('History')">
            🏛️ History
        </button>

        <button class="topic" onclick="openTopic('Geography')">
            🌍 Geography
        </button>

        <button class="topic" onclick="openTopic('Politics')">
            ⚖️ Politics
        </button>

        <button class="topic" onclick="openTopic('Economics')">
            💰 Economics
        </button>

        <button class="topic" onclick="openTopic('Culture')">
            🎭 Culture
        </button>

        <button class="topic" onclick="openTopic('Current Affairs')">
            📰 Current Affairs
        </button>

        <button class="topic" onclick="openTopic('Others')">
            📚 Others
        </button>
    </div>

    <div id="sets" class="card hidden">
        <button class="back" onclick="goBackToLibrary()">← Back</button>

        <h2 id="setsTitle"></h2>

        <p>Select a study set.</p>

        <div id="setList"></div>
    </div>

    <div id="study" class="card hidden">
        <button class="back" onclick="goBackToSets()">← Back</button>

        <h2 id="studyTitle"></h2>

        <div id="questions"></div>
    </div>

</div>

<script>

const SUPABASE_URL =
"https://sadtwnopdcdmqbheeuzi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Zse78UJoYykCAEHYE4sx-w_BaQBu8Xe";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let selectedTopic = "";

async function openTopic(topic) {

    selectedTopic = topic;

    document.getElementById("library")
        .classList.add("hidden");

    document.getElementById("sets")
        .classList.remove("hidden");

    document.getElementById("setsTitle")
        .textContent = topic;

    const setList =
        document.getElementById("setList");

    setList.innerHTML =
        "Loading study sets...";

    const { data, error } =
        await supabaseClient
        .from("questions")
        .select("study_set")
        .eq("topic", topic)
        .not("study_set", "is", null);

    if (error) {

        setList.innerHTML =
            "<div class='error'>" +
            error.message +
            "</div>";

        return;
    }

    const sets = [
        ...new Set(
            data.map(q => q.study_set)
        )
    ];

    if (sets.length === 0) {

        setList.innerHTML =
            "No study sets have been added yet.";

        return;
    }

    setList.innerHTML = "";

    sets.forEach(setName => {

        const button =
            document.createElement("button");

        button.className = "topic";

        button.textContent =
            "📖 " + setName;

        button.onclick =
            () => openStudySet(setName);

        setList.appendChild(button);

    });
}


async function openStudySet(setName) {

    document.getElementById("sets")
        .classList.add("hidden");

    document.getElementById("study")
        .classList.remove("hidden");

    document.getElementById("studyTitle")
        .textContent = setName;

    const questionContainer =
        document.getElementById("questions");

    questionContainer.innerHTML =
        "Loading questions...";

    const { data, error } =
        await supabaseClient
        .from("questions")
        .select("*")
        .eq("topic", selectedTopic)
        .eq("study_set", setName)
        .order("id", { ascending: true });

    if (error) {

        questionContainer.innerHTML =
            "<div class='error'>" +
            error.message +
            "</div>";

        return;
    }

    if (!data || data.length === 0) {

        questionContainer.innerHTML =
            "No questions found.";

        return;
    }

    questionContainer.innerHTML = "";

    data.forEach((q, index) => {

        const div =
            document.createElement("div");

        div.className =
            "study-question";

        div.innerHTML = `

            <strong>
                ${index + 1}. ${escapeHTML(q.question)}
            </strong>

            <p>
                A) ${escapeHTML(q.option_a)}<br>
                B) ${escapeHTML(q.option_b)}<br>
                C) ${escapeHTML(q.option_c)}<br>
                D) ${escapeHTML(q.option_d)}
            </p>

            <div class="answer">
                Answer: ${escapeHTML(q.answer)}
            </div>
        `;

        questionContainer.appendChild(div);

    });
}


function goBackToLibrary() {

    document.getElementById("sets")
        .classList.add("hidden");

    document.getElementById("library")
        .classList.remove("hidden");

}


function goBackToSets() {

    document.getElementById("study")
        .classList.add("hidden");

    document.getElementById("sets")
        .classList.remove("hidden");

}


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
